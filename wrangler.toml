# The open sea: accounts, chat and the shared world, plus the built game as
# static assets, all from one Worker on one origin.
name = "pirates-2d"
main = "server/worker.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Only these reach the Worker; every other path is served straight from dist/.
run_worker_first = ["/api/*", "/ws"]

[[d1_databases]]
binding = "DB"
database_name = "pirates-2d"
# Filled in by `wrangler d1 create pirates-2d`. Local dev does not need a real one.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "SEA"
class_name = "Sea"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sea"]
